<style>
  :root {
    --footer-bg: #0f172a;
    --footer-color: #e6eef8;
    --footer-muted: #9fb0c7;
    --footer-link: #cbd5e1;
    --footer-accent: #4ade80;
    --footer-padding: 36px 18px;
    --footer-max-width: 1150px;

    --footer-font-size: 15px;
    --footer-heading-size: 20px;
    --footer-icon-size: 18px;
  }

  .site-footer {
    background: var(--footer-bg);
    color: var(--footer-color);
    padding: var(--footer-padding);
    margin-top: 40px;
  }

  .site-footer .container {
    max-width: var(--footer-max-width);
    margin: 0 auto;
    display: flex;flex-direction:column;
    gap:20px;
  }

  .site-footer h3 {
    margin: 0 0 18px 0;
    color: var(--footer-color);
    font-size: var(--footer-heading-size);
  }

  .contact-row {
    display:flex;flex-direction:column;
    gap:10px;
  }

  .contact-item{
    display:flex;gap:10px;align-items:center;
    color:var(--footer-link);
  }

  .contact-item svg,
  .contact-item img.icon{
    width:var(--footer-icon-size);
    height:var(--footer-icon-size);
  }

  a{color:var(--footer-link);text-decoration:none;font-weight:600}
  a.whatsapp{color:var(--footer-accent);}

  .copyright{
    margin-top:16px;
    font-size:13px;
    color:var(--footer-muted);
    border-top:1px solid rgba(255,255,255,0.06);
    padding-top:14px;
  }

  @media(min-width:760px){
    .site-footer .container{
      flex-direction:row;justify-content:space-between;
      align-items:flex-start;
    }
  }
</style>

<footer class="site-footer">

          <div>19/154 Trippanachi South, Malappuram, Kerala 673642</div>
        </div>

        <div class="contact-item">
          <svg viewBox="0 0 24 24"><path fill="#cbd5e1" d="M3 8.5v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7L12 13 3 8.5zM21 6H3a2 2 0 0 0-2 2v.01L12 12 23 8.01V8a2 2 0 0 0-2-2z"/></svg>
          <div><a href="mailto:info@helixcer.com">info@helixcer.com</a></div>
        </div>

        <div class="contact-item">
          <img src="https://static.wixstatic.com/media/35c132_d1696c4910a64ffeb0c31667c0856c59~mv2.png" class="icon">
          <div><a class="whatsapp" href="https://wa.me/916282010794">+91 62820 10794</a></div>
        </div>

      </div>
    </div>

    <div class="copyright">
      © <span id="sharedFooterYear"></span> Helixcer Logistics — All rights reserved.
    </div>

  </div>

  <script>
    document.getElementById("sharedFooterYear").textContent = new Date().getFullYear();
  </script>
</footer>
