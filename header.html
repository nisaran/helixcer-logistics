<style>
  :root {
    --header-bg: #ffffff;
    --header-text: #0f172a;
    --header-muted: #64748b;
    --accent: #1f56ff;
    --radius: 12px;
  }

  .site-header {
    width: 100%;
    background: var(--header-bg);
    border-bottom: 1px solid #e5e7eb;
    position: sticky;
    top: 0;
    z-index: 1000;
  }

  .header-wrap {
    max-width: 1150px;
    margin: 0 auto;
    padding: 12px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo img {
    height: 42px;
  }

  /* NAVIGATION */
  nav.nav {
    display: flex;
    gap: 26px;
    align-items: center;
  }

  nav.nav a {
    text-decoration: none;
    color: var(--header-text);
    font-weight: 600;
    padding: 6px 2px;
    position: relative;
  }

  /* ACTIVE TAB */
  nav.nav a.active {
    color: var(--accent);
  }

  nav.nav a.active::after {
    content: "";
    position: absolute;
    height: 3px;
    background: var(--accent);
    width: 100%;
    left: 0;
    bottom: -4px;
    border-radius: 6px;
  }

  /* HAMBURGER */
  .hamburger {
    display: none;
    width: 32px;
    height: 32px;
    padding: 4px;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid #e5e7eb;
  }

  .hamburger div {
    width: 100%;
    height: 3px;
    background: #0f172a;
    margin: 5px 0;
    border-radius: 4px;
  }

  /* MOBILE MENU */
  @media (max-width: 780px) {
    nav.nav {
      display: none;
      position: absolute;
      top: 68px;
      right: 0;
      left: 0;
      background: #fff;
      padding: 20px;
      flex-direction: column;
      gap: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
    }

    body.show-menu nav.nav {
      display: flex;
    }

    .hamburger {
      display: block;
    }
  }
</style>

<header class="site-header">
  <div class="header-wrap">

    <!-- LOGO -->
    <a class="logo" href="/">
      <img src="https://static.wixstatic.com/media/35c132_abad5506f5da47bfb6082108b6b204e1~mv2.png" alt="Helixcer Logistics">
    </a>

    <!-- NAVIGATION -->
    <nav class="nav">
      <a href="/">Home</a>
      <a href="/#services">Services</a>
      <a href="/contact">Contact</a>
      <a href="/calculator">Freight Calculator</a>
      <a href="/track">Track</a>
    </nav>

    <!-- HAMBURGER -->
    <div class="hamburger" onclick="document.body.classList.toggle('show-menu')">
      <div></div>
      <div></div>
      <div></div>
    </div>

  </div>
</header>

<script>
  // Auto-close mobile menu on link click
  document.addEventListener("click", function(e){
    if(e.target.closest("nav a")){
      document.body.classList.remove("show-menu");
    }
  });
</script>
