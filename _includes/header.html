<!-- _includes/header.html -->
<header class="site-header" role="banner">
  <div class="header-wrap">
    <a class="logo" href="{{ site.baseurl }}/">
      <img src="https://static.wixstatic.com/media/35c132_abad5506f5da47bfb6082108b6b204e1~mv2.png" alt="Helixcer Logistics" />
    </a>

    <button class="hamburger" aria-label="Toggle menu" onclick="document.body.classList.toggle('show-menu')">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav" role="navigation" aria-label="Primary">
      <ul>
        <li><a href="{{ site.baseurl }}/" {% if page.url == "/" %}class="active"{% endif %}>Home</a></li>
        <li><a href="{{ site.baseurl }}/#services">Services</a></li>
        <li><a href="{{ site.baseurl }}/calculator/" {% if page.url == "/calculator/" %}class="active"{% endif %}>Freight Calculator</a></li>
        <li><a href="{{ site.baseurl }}/track/" {% if page.url == "/track/" %}class="active"{% endif %}>Track</a></li>
        <li><a href="{{ site.baseurl }}/contact/" {% if page.url == "/contact/" %}class="active"{% endif %}>Contact us</a></li>
      </ul>
    </nav>
  </div>

  <style>
    :root {
      --header-bg:#fff; --header-text:#0f172a; --accent:#1f56ff;
    }
    .site-header{width:100%;background:var(--header-bg);border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:1000}
    .header-wrap{max-width:1150px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .logo img{height:42px}
    .nav ul{display:flex;gap:22px;list-style:none;margin:0;padding:0;align-items:center}
    .nav a{text-decoration:none;color:var(--header-text);font-weight:600;padding:6px 0;position:relative}
    .nav a.active{color:var(--accent)}
    .nav a.active::after{content:"";position:absolute;left:0;bottom:-6px;height:3px;background:var(--accent);width:100%;border-radius:6px}
    .hamburger{display:none;border:1px solid #e5e7eb;padding:6px;border-radius:8px;background:#fff}
    .hamburger span{display:block;width:18px;height:3px;background:#0f172a;margin:3px 0;border-radius:3px}
    @media(max-width:820px){
      .nav{display:none;position:absolute;left:0;right:0;top:68px;background:#fff;padding:16px;border-bottom-left-radius:12px;border-bottom-right-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,0.06)}
      body.show-menu .nav{display:block}
      .nav ul{flex-direction:column;align-items:flex-start;gap:14px}
      .hamburger{display:block}
    }
  </style>

  <script>
    // auto close mobile nav on link click
    document.addEventListener('click', function (e) {
      if (e.target.closest('.nav a')) document.body.classList.remove('show-menu');
    });
  </script>
</header>
