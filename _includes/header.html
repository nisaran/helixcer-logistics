<!-- _includes/header.html -->

<header class="site-header" role="banner">
  <div class="header-wrap">

    <!-- LOGO -->
    <a class="logo" href="{{ site.baseurl }}/">
      <img src="https://static.wixstatic.com/media/35c132_abad5506f5da47bfb6082108b6b204e1~mv2.png" alt="Helixcer Logistics">
    </a>

    <!-- HAMBURGER -->
    <button class="hamburger" aria-label="Toggle menu" onclick="document.body.classList.toggle('show-menu')">
      <div class="bar top"></div>
      <div class="bar middle"></div>
      <div class="bar bottom"></div>
    </button>

    <!-- NAVIGATION -->
    <nav class="nav" role="navigation" aria-label="Primary">
      <ul>
        <li><a href="{{ site.baseurl }}/" {% if page.url == "/" %}class="active"{% endif %}>Home</a></li>

        <li><a href="{{ site.baseurl }}/#services">Services</a></li>

        <li><a href="{{ site.baseurl }}/calculator/" {% if page.url == "/calculator/" %}class="active"{% endif %}>
          Freight Calculator
        </a></li>

        <li><a href="{{ site.baseurl }}/track/" {% if page.url == "/track/" %}class="active"{% endif %}>
          Track
        </a></li>

        <li><a href="{{ site.baseurl }}/contact/" {% if page.url == "/contact/" %}class="active"{% endif %}>
          Contact
        </a></li>
      </ul>
    </nav>

  </div>

  <!-- JS: CLOSE MOBILE MENU ON LINK CLICK -->
  <script>
    document.addEventListener("click", function (e) {
      if (e.target.closest(".nav a")) {
        document.body.classList.remove("show-menu");
      }
    });
  </script>

  <!-- JS: HEADER SHADOW ON SCROLL -->
  <script>
    (function(){
      const header = document.querySelector('.site-header');
      if(!header) return;

      function onScroll(){
        if(window.scrollY > 8){
          header.classList.add('header--scrolled');
        } else {
          header.classList.remove('header--scrolled');
        }
      }
      window.addEventListener('scroll', onScroll, { passive:true });
      onScroll();
    })();
  </script>

  <!-- JS: SCROLL-SPY FOR SERVICES SECTION -->
  <script>
    (function(){
      const servicesLink = document.querySelector('nav.nav a[href$="#services"]');
      const servicesEl = document.querySelector('#services');

      if(!servicesLink || !servicesEl) return;

      function setActive(isActive){
        document.querySelectorAll("nav.nav a").forEach(a => a.classList.remove("active"));
        if(isActive) servicesLink.classList.add("active");
        else {
          const path = window.location.pathname.replace(/\/+$/,'');
          document.querySelectorAll('nav.nav a').forEach(a => {
            const href = a.getAttribute('href') || '';
            if(href.startsWith('/') && !href.includes('#')){
              const clean = href.replace(/\/+$/,'');
              if(clean === path) a.classList.add('active');
            }
          });
        }
      }

      const obs = new IntersectionObserver((entries)=>{
        entries.forEach(en => {
          if(en.isIntersecting) setActive(true);
          else setActive(false);
        });
      }, { threshold: 0.45 });

      obs.observe(servicesEl);

      if(window.location.hash === '#services'){
        setActive(true);
      }
    })();
  </script>

</header>
