  </div>

  <!-- CLOSE MENU WHEN CLICKING LINKS -->
  <script>
    document.addEventListener("click", function (e) {
      if (e.target.closest(".nav a")) {
        document.body.classList.remove("show-menu");
      }
    });
  </script>

  <!-- HEADER SHADOW -->
  <script>
    (function(){
      const header = document.querySelector('.site-header');
      function onScroll(){
        if (window.scrollY > 8) header.classList.add('header--scrolled');
        else header.classList.remove('header--scrolled');
      }
      window.addEventListener("scroll", onScroll, { passive: true });
      onScroll();
    })();
  </script>

  <!-- SCROLL-SPY FOR SERVICES -->
  <script>
    (function(){
      const servicesLink = document.querySelector('nav.nav a[href$="#services"]');
      const servicesEl = document.querySelector('#services');

      if (!servicesLink || !servicesEl) return;

      function setActive(isActive){
        document.querySelectorAll("nav.nav a").forEach(a => a.classList.remove("active"));
        if (isActive) servicesLink.classList.add("active");
      }

      const obs = new IntersectionObserver(entries => {
        entries.forEach(en => setActive(en.isIntersecting));
      }, { threshold: 0.45 });

      obs.observe(servicesEl);

      if (window.location.hash === "#services") setActive(true);
    })();
  </script>

</header>
