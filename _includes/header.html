<header class="site-header" role="banner">
  <div class="header-wrap">
    <a class="logo" href="{{ site.baseurl }}/">
      <img src="https://static.wixstatic.com/media/35c132_abad5506f5da47bfb6082108b6b204e1~mv2.png" alt="Helixcer Logistics" />
    </a>

    <!-- HAMBURGER BUTTON -->
    <button class="hamburger" aria-label="Toggle menu" onclick="document.body.classList.toggle('show-menu')">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- NAVIGATION -->
    <nav class="nav" role="navigation" aria-label="Primary">
      <ul>
        <li><a href="{{ site.baseurl }}/" {% if page.url == "/" %}class="active"{% endif %}>Home</a></li>
        <li><a href="{{ site.baseurl }}/#services">Services</a></li>
        <li><a href="{{ site.baseurl }}/contact/" {% if page.url == "/contact/" %}class="active"{% endif %}>Contact</a></li>
        <li><a href="{{ site.baseurl }}/calculator/" {% if page.url == "/calculator/" %}class="active"{% endif %}>Freight Calculator</a></li>
        <li><a href="{{ site.baseurl }}/track/" {% if page.url == "/track/" %}class="active"{% endif %}>Track</a></li>
      </ul>
    </nav>
  </div>

  <style>
    :root {
      --header-bg:#fff;
      --header-text:#0f172a;
      --accent:#1f56ff;
    }

    .site-header{
      width:100%;background:var(--header-bg);
      border-bottom:1px solid #e5e7eb;
      position:sticky;top:0;z-index:1000;
    }

    .header-wrap{
      max-width:1150px;margin:0 auto;
      padding:14px 18px;
      display:flex;align-items:center;justify-content:space-between;
    }

    .logo img{height:42px;}

    nav.nav ul{
      display:flex;gap:24px;align-items:center;
      list-style:none;margin:0;padding:0;
    }
    nav.nav a{
      text-decoration:none;color:var(--header-text);
      font-weight:600;position:relative;padding:6px 2px;
    }
    nav.nav a.active{
      color:var(--accent);
    }
    nav.nav a.active::after{
      content:"";position:absolute;left:0;bottom:-5px;
      height:3px;width:100%;border-radius:4px;
      background:var(--accent);
    }

    /* BIGGER HAMBURGER */
    .hamburger{
      display:none;
      width:42px;
      height:42px;
      padding:8px;
      border-radius:10px;
      border:1px solid #e0e0e0;
      background:#fff;
      cursor:pointer;
      position:relative;
      justify-content:center;
      align-items:center;
    }

    .hamburger span{
      display:block;
      width:26px;
      height:3px;
      margin:5px 0;
      background:#0f172a;
      border-radius:4px;
      transition:0.3s ease;
    }

    /* MOBILE MENU */
    @media(max-width:820px){
      nav.nav{
        display:none;
        position:absolute;
        left:0;right:0;top:68px;
        background:#fff;
        padding:18px 20px;
        border-bottom-left-radius:12px;
        border-bottom-right-radius:12px;
        box-shadow:0 8px 24px rgba(0,0,0,0.06);
      }
      body.show-menu nav.nav{display:block;}
      nav.nav ul{flex-direction:column;align-items:flex-start;gap:16px;}

      .hamburger{display:flex;}
    }

    /* ANIMATE → X */
    body.show-menu .hamburger span:nth-child(1){
      transform:translateY(8px) rotate(45deg);
    }
    body.show-menu .hamburger span:nth-child(2){
      opacity:0;
    }
    body.show-menu .hamburger span:nth-child(3){
      transform:translateY(-8px) rotate(-45deg);
    }
  </style>

  <script>
    // Close menu when clicking any link
    document.addEventListener("click", (e)=>{
      if(e.target.closest(".nav a")){
        document.body.classList.remove("show-menu");
      }
    });
  </script>
</header>
